    <script>
      (function() {
        // Suppress uninformative cross-origin "Script error." that bubble to iframe parent
        window.addEventListener('error', function(e) {
          if (e && (e.message === 'Script error.' || !e.message)) {
            console.warn('Suppressing unhandled cross-origin script error in preview container:', e);
            if (typeof e.preventDefault === 'function') e.preventDefault();
            return true;
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.warn('Unhandled promise rejection captured:', e && e.reason);
          if (e && typeof e.preventDefault === 'function') e.preventDefault();
        });

        try {
          var rawFetch = window.fetch;
          var currentFetch = typeof rawFetch === 'function' ? function() {
            return rawFetch.apply(window, arguments);
          } : rawFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {
            // Silently fallback if environment locks prototype
          }
        }
      })();
    </script>
